<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mikke v3.0 画面・操作リファレンス</title><style>body{margin:0;background:#f4f2ee;min-height:100vh}</style></head><body>
<div id="mikke-demo" class="viz-dotted-background">
  <div class="mikke-phone" aria-label="Mikke 操作デモ">
    <div class="mikke-app" id="mikke-app"></div>
  </div>
</div>
<style>
#mikke-demo{display:flex;justify-content:center;padding:18px 8px 24px;background:transparent;color-scheme:light}
#mikke-demo *{box-sizing:border-box}
#mikke-demo .mikke-phone{--paper:#FBFAF5;--white:#fff;--soft:#F5F4ED;--ink:#252722;--sub:#6D7069;--line:#E8E7DF;--coral:#F47769;--orange:#EFA15F;--pale:#FDE9E2;--deep:#AD4E45;width:min(100%,390px);background:var(--paper);color:var(--ink);border:1px solid #E5E2D8;border-radius:28px;box-shadow:0 18px 52px #2B27201C;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px;line-height:1.5}
#mikke-demo button,#mikke-demo input,#mikke-demo select,#mikke-demo textarea{font:inherit}
#mikke-demo button{cursor:pointer}
#mikke-demo .shell-top{padding:21px 21px 13px;display:flex;align-items:center;justify-content:space-between;background:var(--white)}
#mikke-demo .brand{font-size:29px;line-height:1;font-weight:800;letter-spacing:-1.8px;color:var(--coral)}
#mikke-demo .brand span{color:var(--orange)}
#mikke-demo .place{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:4px}
#mikke-demo .page{padding:4px 20px 25px;min-height:550px;background:var(--white)}
#mikke-demo h1{font-size:24px;line-height:1.3;letter-spacing:-.5px;margin:8px 0 5px;font-weight:750}
#mikke-demo h2{font-size:17px;line-height:1.35;margin:0;font-weight:750}
#mikke-demo h3{font-size:15px;margin:0;font-weight:700}
#mikke-demo p{margin:0}
#mikke-demo .muted{color:var(--sub);font-size:12px}
#mikke-demo .tiny{color:var(--sub);font-size:11px}
#mikke-demo .eyebrow{color:var(--deep);font-size:11px;font-weight:750;letter-spacing:.07em}
#mikke-demo .section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 12px}
#mikke-demo .text-button{border:0;background:none;padding:5px 0;color:var(--deep);font-weight:700;font-size:12px}
#mikke-demo .hero{height:263px;border-radius:20px;position:relative;overflow:hidden;background:#8f664b;margin-top:18px}
#mikke-demo img{display:block;width:100%;object-fit:cover}
#mikke-demo .hero>img{height:100%}
#mikke-demo .hero:after{content:"";position:absolute;inset:32% 0 0;background:linear-gradient(transparent,#241B19C9)}
#mikke-demo .hero-content{position:absolute;z-index:1;bottom:18px;left:18px;right:18px;color:#fff}
#mikke-demo .hero-content small{font-size:11px;font-weight:750;letter-spacing:.05em}
#mikke-demo .hero-content strong{display:block;font-size:22px;line-height:1.25;margin:5px 0 13px}
#mikke-demo .hero-content button{border:0;border-radius:999px;background:var(--white);color:var(--ink);padding:10px 17px;font-weight:750;font-size:12px}
#mikke-demo .mini-route{display:flex;width:100%;align-items:center;gap:11px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:11px 0;color:var(--ink)}
#mikke-demo .mini-route img{height:64px;width:76px;border-radius:11px;flex:none}
#mikke-demo .mini-route strong{display:block;font-size:13px}
#mikke-demo .mini-route span{display:block;font-size:11px;color:var(--sub);margin-top:4px}
#mikke-demo .intro-tile{border-radius:18px;background:var(--pale);padding:17px 18px;display:flex;align-items:center;gap:12px}
#mikke-demo .intro-tile .tile-ico{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;color:var(--deep);background:#fff}
#mikke-demo .intro-tile strong{font-size:13px;display:block}
#mikke-demo .intro-tile p{font-size:11px;color:var(--sub)}
#mikke-demo .intro-tile button{margin-left:auto;flex:none;background:none;border:0;color:var(--deep);padding:8px}
#mikke-demo .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:16px -20px 17px;padding:0 20px}
#mikke-demo .chips::-webkit-scrollbar{display:none}
#mikke-demo .chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--white);color:var(--ink);padding:7px 14px;font-size:12px}
#mikke-demo .chip.on{background:var(--ink);border-color:var(--ink);color:white}
#mikke-demo .post{background:var(--white);border-radius:19px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
#mikke-demo .post-image{height:191px;position:relative;display:block;width:100%;padding:0;border:0;background:var(--soft)}
#mikke-demo .post-image img{height:100%}
#mikke-demo .post-image .tag{position:absolute;left:12px;top:12px;background:#fffE;color:var(--ink);border-radius:100px;font-size:10px;padding:5px 9px;font-weight:750}
#mikke-demo .post-body{padding:14px 15px 12px}
#mikke-demo .byline{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:11px;margin-bottom:7px}
#mikke-demo .avatar{width:23px;height:23px;border-radius:50%;background:var(--pale);color:var(--deep);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
#mikke-demo .post-title{border:0;background:none;text-align:left;color:var(--ink);padding:0;font-size:17px;font-weight:750;line-height:1.35}
#mikke-demo .route-chain{font-size:11px;color:var(--sub);margin:7px 0 10px;line-height:1.5}
#mikke-demo .post-actions{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
#mikke-demo .post-actions button{display:flex;align-items:center;gap:4px;border:0;background:none;padding:4px 5px;color:var(--ink);font-size:11px}
#mikke-demo .post-actions button.on{color:var(--deep);font-weight:750}
#mikke-demo .back{border:0;background:none;padding:5px 0 12px;display:flex;align-items:center;gap:3px;color:var(--ink);font-size:13px;font-weight:700}
#mikke-demo .detail-photo{height:235px;border-radius:18px}
#mikke-demo .detail-author{display:flex;align-items:center;gap:8px;margin-top:15px;font-size:12px}
#mikke-demo .detail-author small{color:var(--sub)}
#mikke-demo .detail-title{margin:12px 0 6px!important}
#mikke-demo .meta-row{display:flex;align-items:center;gap:11px;color:var(--sub);font-size:11px;flex-wrap:wrap;margin:10px 0 15px}
#mikke-demo .detail-lead{font-size:13px;line-height:1.7;margin:0 0 21px!important}
#mikke-demo .timeline{position:relative;margin-top:13px}
#mikke-demo .timeline:before{content:"";position:absolute;left:14px;top:13px;bottom:70px;width:2px;background:var(--line)}
#mikke-demo .stop{position:relative;padding-left:40px;margin-bottom:25px}
#mikke-demo .stop-num{position:absolute;left:0;top:0;width:29px;height:29px;display:grid;place-items:center;color:var(--deep);background:var(--pale);border-radius:50%;font-size:12px;font-weight:800}
#mikke-demo .stop img{border-radius:12px;height:142px;margin:9px 0}
#mikke-demo .stop p{font-size:12px;line-height:1.6}
#mikke-demo .stop .transfer{font-size:11px;color:var(--sub);margin-top:11px}
#mikke-demo .action-row{display:flex;gap:8px;margin:17px 0}
#mikke-demo .primary,#mikke-demo .secondary{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:13px;padding:12px 13px;font-weight:750;font-size:13px;min-height:44px}
#mikke-demo .primary{background:linear-gradient(110deg,var(--coral),var(--orange));border:0;color:#2b2320}
#mikke-demo .secondary{background:var(--white);border:1px solid var(--line);color:var(--ink)}
#mikke-demo .action-row>*{flex:1}
#mikke-demo .full{width:100%}
#mikke-demo .comments{border-top:1px solid var(--line);padding-top:17px;margin-top:24px}
#mikke-demo .comment{display:flex;gap:8px;margin:13px 0;font-size:12px}
#mikke-demo .comment .avatar{margin-top:1px}
#mikke-demo .comment strong{font-size:11px}
#mikke-demo .comment p{line-height:1.5}
#mikke-demo .comment-form{display:flex;gap:7px;margin-top:15px}
#mikke-demo .field{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--white);color:var(--ink);padding:10px 12px;min-height:44px;outline-color:var(--coral);font-size:14px}
#mikke-demo .field::placeholder{color:#999A94}
#mikke-demo textarea.field{resize:vertical;min-height:75px}
#mikke-demo .comment-form button{border:0;background:var(--ink);color:#fff;border-radius:11px;padding:0 13px;white-space:nowrap}
#mikke-demo .options{display:grid;gap:9px;margin:19px 0}
#mikke-demo .option{width:100%;border:1px solid var(--line);border-radius:15px;background:var(--white);color:var(--ink);text-align:left;padding:15px;display:flex;align-items:center;gap:12px}
#mikke-demo .option>i{color:var(--deep)}
#mikke-demo .option strong{font-size:14px;display:block}
#mikke-demo .option small{font-size:11px;color:var(--sub)}
#mikke-demo .option .arr{margin-left:auto;color:var(--sub)}
#mikke-demo .form-group{margin-top:19px}
#mikke-demo .form-group label{display:block;font-size:12px;font-weight:750;margin-bottom:8px}
#mikke-demo .choice-row{display:flex;gap:8px}
#mikke-demo .choice-row button{flex:1;padding:10px 7px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:11px;font-size:12px}
#mikke-demo .choice-row button.on{border-color:var(--coral);background:var(--pale);color:var(--deep);font-weight:750}
#mikke-demo .notice{background:var(--soft);border-radius:12px;padding:11px 13px;font-size:11px;color:var(--sub);line-height:1.55;margin:16px 0}
#mikke-demo .plan-card{border:1px solid var(--line);border-radius:16px;background:var(--white);padding:16px;margin:12px 0}
#mikke-demo .plan-card.featured{border-color:#F0A195}
#mikke-demo .plan-card .label{font-size:11px;color:var(--deep);font-weight:750}
#mikke-demo .plan-card h2{margin:6px 0}
#mikke-demo .plan-card p{font-size:12px;color:var(--sub);line-height:1.6}
#mikke-demo .plan-card .primary{margin-top:12px;width:100%}
#mikke-demo .journey-step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
#mikke-demo .journey-step .number{width:28px;height:28px;border-radius:50%;background:var(--pale);color:var(--deep);display:grid;place-items:center;font-weight:750;flex:none}
#mikke-demo .journey-step strong{display:block;font-size:14px}
#mikke-demo .journey-step small{color:var(--sub)}
#mikke-demo .segmented{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:16px 0}
#mikke-demo .segmented button{flex:1;border:0;background:none;border-radius:9px;padding:8px 1px;color:var(--sub);font-size:11px;white-space:nowrap}
#mikke-demo .segmented button.on{background:var(--white);color:var(--ink);font-weight:750;box-shadow:0 1px 4px #25272218}
#mikke-demo .saved-item{border-bottom:1px solid var(--line);padding:13px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
#mikke-demo .saved-item strong{display:block;font-size:13px}
#mikke-demo .saved-item small{color:var(--sub);font-size:11px}
#mikke-demo .saved-item button{border:0;background:none;color:var(--deep);padding:8px;font-size:12px;flex:none}
#mikke-demo .profile-hero{display:flex;align-items:center;gap:13px;padding:22px 0;border-bottom:1px solid var(--line)}
#mikke-demo .profile-hero .avatar{width:54px;height:54px;font-size:21px}
#mikke-demo .profile-list{margin-top:16px}
#mikke-demo .profile-list button{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);display:flex;justify-content:space-between;padding:15px 2px;text-align:left}
#mikke-demo .free-quota{margin:20px 0 5px;padding:19px 20px;border-radius:19px;background:linear-gradient(115deg,var(--pale),#FFF5E9);border:1px solid #F6D8CD}
#mikke-demo .free-quota .quota-label{font-size:13px;font-weight:750;color:var(--deep)}
#mikke-demo .free-quota .quota-main{display:flex;align-items:baseline;gap:4px;margin:4px 0 1px;font-size:13px}
#mikke-demo .free-quota .quota-main strong{font-size:42px;line-height:1.15;color:var(--deep);font-weight:800}
#mikke-demo .free-quota button{margin-top:10px;border:0;border-radius:10px;background:var(--white);color:var(--deep);font-size:12px;font-weight:750;padding:9px 12px}
#mikke-demo .search-row{display:flex;gap:6px;margin:12px 0 10px;align-items:stretch}
#mikke-demo .search-row .field{min-width:0;flex:1}
#mikke-demo .search-row button{border:0;background:var(--ink);color:white;border-radius:11px;padding:0 10px;font-size:12px;font-weight:750;white-space:nowrap;min-height:44px}
#mikke-demo .search-row .details-button{background:var(--white);color:var(--ink);border:1px solid var(--line)}
#mikke-demo .search-row .details-button[aria-expanded="true"]{border-color:var(--coral);color:var(--deep);background:var(--pale)}
#mikke-demo .filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:4px 0 13px}
#mikke-demo .filter-grid[hidden]{display:none}
#mikke-demo .filter-grid label{min-width:0;display:block;color:var(--sub);font-size:11px}
#mikke-demo .filter-grid select{margin-top:4px;min-height:39px;padding:6px 8px;font-size:12px}
#mikke-demo .sort-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px;color:var(--sub);font-size:11px}
#mikke-demo .sort-row select{width:143px;min-height:36px;padding:5px 7px;font-size:11px}
#mikke-demo .route-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#mikke-demo .route-grid .post{min-width:0;margin:0;border-radius:14px}
#mikke-demo .route-grid .post-image{height:119px}
#mikke-demo .route-grid .post-image .tag{font-size:9px;padding:3px 6px;left:7px;top:7px}
#mikke-demo .route-grid .post-body{padding:10px 9px 8px}
#mikke-demo .route-grid .post-title{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
#mikke-demo .route-grid .byline{font-size:10px;margin:6px 0 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#mikke-demo .route-grid .meta-row{font-size:10px;gap:4px;margin:6px 0}
#mikke-demo .route-grid .post-actions{gap:2px;padding-top:6px;justify-content:space-between}
#mikke-demo .route-grid .post-actions button{padding:4px 2px;gap:3px;font-size:10px;min-height:35px}
#mikke-demo .route-grid .post-actions svg{width:15px;height:15px}
#mikke-demo .route-grid .avatar{width:18px;height:18px;font-size:9px}
#mikke-demo .route-grid .card-price{color:var(--sub);font-size:10px}
#mikke-demo .home-page{padding:0;min-height:550px;background:var(--white)}
#mikke-demo .home-hero{position:relative;min-height:399px;overflow:hidden;background:#515952;color:white}
#mikke-demo .home-hero>img{position:absolute;inset:0;height:100%;object-position:center 45%}
#mikke-demo .home-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#252722BA 0%,#25272245 49%,#2527229F 100%)}
#mikke-demo .home-hero-inner{position:relative;z-index:1;padding:22px 20px 35px}
#mikke-demo .home-topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}
#mikke-demo .home-topline strong{font-size:24px;font-weight:800;letter-spacing:-1px;color:white}
#mikke-demo .home-location{font-size:11px;padding:7px 10px;background:#FFFFFF2B;border:1px solid #FFFFFF4B;border-radius:999px}
#mikke-demo .home-location svg{width:13px;height:13px;vertical-align:-2px}
#mikke-demo .home-greeting{font-size:12px;color:#FFF5F0}
#mikke-demo .home-hero h1{font-size:26px;color:white;margin:5px 0 15px}
#mikke-demo .home-chips{display:flex;gap:6px;margin-bottom:15px}
#mikke-demo .home-chips button{border:1px solid #FFFFFF70;background:#FFFFFF27;color:white;border-radius:999px;padding:7px 11px;font-size:11px;white-space:nowrap;min-height:34px}
#mikke-demo .home-chips button:first-child{background:var(--white);color:var(--deep);border-color:var(--white)}
#mikke-demo .home-chips svg{width:13px;height:13px;vertical-align:-2px}
#mikke-demo .home-search{background:#FFFEF4ED;border:1px solid #FFFFFFB0;border-radius:17px;padding:13px;box-shadow:0 10px 22px #15181433;color:var(--ink)}
#mikke-demo .home-search .home-search-caption{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:8px}
#mikke-demo .home-search .home-controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
#mikke-demo .home-search label{display:block;min-width:0;font-size:10px;color:var(--sub)}
#mikke-demo .home-search label:first-child{grid-column:1/-1}
#mikke-demo .home-search select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink);padding:7px 9px;font-size:12px;min-height:36px;margin-top:3px}
#mikke-demo .home-search button{width:100%;border:0;border-radius:10px;background:var(--coral);color:#32221D;font-weight:750;min-height:39px;font-size:12px}
#mikke-demo .home-content{position:relative;margin-top:-18px;padding:23px 20px 25px;border-radius:21px 21px 0 0;background:var(--white)}
#mikke-demo .home-content .section-head{margin:0 0 11px}
#mikke-demo .home-content .section-head:not(:first-child){margin-top:23px}
#mikke-demo .home-route-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#mikke-demo .home-route{border:0;background:none;text-align:left;color:var(--ink);padding:0;min-width:0}
#mikke-demo .home-route img{height:100px;border-radius:12px}
#mikke-demo .home-route strong{display:block;font-size:12px;line-height:1.4;margin-top:7px}
#mikke-demo .home-route span{display:block;font-size:10px;color:var(--sub);margin-top:2px}
#mikke-demo .home-save-panel{display:flex;align-items:center;gap:11px;padding:13px;border-radius:13px;background:var(--soft)}
#mikke-demo .home-save-panel .tile-ico{display:grid;place-items:center;width:37px;height:37px;flex:none;border-radius:10px;background:var(--white);color:var(--deep)}
#mikke-demo .home-save-panel strong{font-size:12px;display:block}
#mikke-demo .home-save-panel small{font-size:10px;color:var(--sub)}
#mikke-demo .home-save-panel button{margin-left:auto;background:none;border:0;color:var(--deep);font-weight:750;font-size:12px;white-space:nowrap}
#mikke-demo .home-add{width:100%;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:10px;font-size:12px;font-weight:750}
#mikke-demo .page-banner{height:145px;position:relative;border-radius:17px;overflow:hidden;margin:5px 0 16px;background:var(--soft);color:white}
#mikke-demo .page-banner>img{height:100%}
#mikke-demo .page-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#252722AC 0%,#25272266 57%,transparent 100%)}
#mikke-demo .page-banner-copy{position:absolute;z-index:1;left:16px;right:16px;bottom:15px}
#mikke-demo .page-banner h1{color:white;margin:0 0 4px;font-size:21px}
#mikke-demo .page-banner p{font-size:11px;color:#FFF9F1}
#mikke-demo .route-grid .post{border-color:#F0EEE8;box-shadow:0 3px 13px #2527220B}
#mikke-demo .route-grid .post-image{height:125px}
#mikke-demo .option{background:var(--paper);border-color:#EFEEE6}
#mikke-demo .option:active{background:var(--pale)}
#mikke-demo .plan-card{border-color:#EFEDE6;box-shadow:0 3px 12px #2527220A}
#mikke-demo .results-page h1{margin-bottom:11px}
#mikke-demo .result-summary{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
#mikke-demo .result-summary span{background:var(--soft);border-radius:999px;padding:6px 10px;font-size:11px;color:var(--ink)}
#mikke-demo .result-main{padding:16px 14px 15px;border-radius:19px;background:var(--paper);border:1px solid var(--line)}
#mikke-demo .result-main .label{font-size:11px;color:var(--deep);font-weight:750}
#mikke-demo .result-main h2{margin:5px 0 3px;font-size:17px}
#mikke-demo .result-main .description{font-size:11px;color:var(--sub);margin-bottom:17px}
#mikke-demo .result-timeline{position:relative;display:grid;gap:14px;margin:0 0 17px}
#mikke-demo .result-timeline:before{content:"";position:absolute;left:22px;top:20px;bottom:26px;border-left:3px dotted #DBB8AF}
#mikke-demo .result-stop{position:relative;display:grid;grid-template-columns:47px minmax(0,1fr);gap:6px;align-items:center}
#mikke-demo .result-marker{z-index:1;width:27px;height:27px;border-radius:50%;background:var(--coral);color:#33231F;display:grid;place-items:center;margin-left:9px;font-size:12px;font-weight:800}
#mikke-demo .result-stop:nth-child(even) .result-marker{background:var(--orange)}
#mikke-demo .result-stop-card{min-width:0;display:flex;align-items:center;gap:9px;border-radius:14px;background:var(--pale);padding:9px}
#mikke-demo .result-stop:nth-child(even) .result-stop-card{background:#F3EFE8}
#mikke-demo .result-stop-card .result-stop-text{min-width:0;flex:1}
#mikke-demo .result-stop-card strong{display:block;font-size:12px;line-height:1.35;overflow-wrap:anywhere}
#mikke-demo .result-stop-card small{display:block;font-size:10px;color:var(--sub);margin-bottom:2px}
#mikke-demo .result-stop-card img{width:47px;height:47px;border-radius:9px;flex:none}
#mikke-demo .result-main>.primary{width:100%}
#mikke-demo .result-alt{border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin:9px 0;background:var(--white)}
#mikke-demo .result-alt .label{font-size:11px;color:var(--deep);font-weight:750}
#mikke-demo .result-alt strong{display:block;font-size:14px;margin:4px 0}
#mikke-demo .result-alt p{font-size:11px;color:var(--sub);line-height:1.5}
#mikke-demo .result-alt button{border:0;background:none;color:var(--deep);font-size:12px;font-weight:750;padding:9px 0 0}
#mikke-demo .route-story .detail-photo{height:220px;border-radius:17px;object-position:center}
#mikke-demo .route-story .detail-author{margin-top:14px}
#mikke-demo .route-story .detail-lead{margin-bottom:19px!important}
#mikke-demo .story-heading{display:flex;align-items:baseline;justify-content:space-between;margin:19px 0 12px}
#mikke-demo .story-heading small{font-size:11px;color:var(--sub)}
#mikke-demo .story-stream{position:relative;margin:6px 0 20px}
#mikke-demo .story-stream:before{content:"";position:absolute;left:40px;top:15px;bottom:20px;border-left:2px solid var(--line)}
#mikke-demo .story-entry{display:grid;grid-template-columns:54px minmax(0,1fr);gap:7px;position:relative;margin-bottom:16px}
#mikke-demo .story-time{text-align:left;color:var(--deep);font-size:11px;font-weight:750;line-height:1.25;padding-top:8px}
#mikke-demo .story-time:after{content:"";position:absolute;top:16px;left:36px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid var(--white)}
#mikke-demo .story-card{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--white);box-shadow:0 3px 13px #2527220A}
#mikke-demo .story-card img{height:150px}
#mikke-demo .story-card-body{padding:12px 13px 14px}
#mikke-demo .story-card-body small{color:var(--deep);font-size:11px;font-weight:750}
#mikke-demo .story-card-body h3{margin:4px 0 6px;font-size:14px}
#mikke-demo .story-card-body p{font-size:12px;line-height:1.65}
#mikke-demo .story-card-body .transfer{margin-top:9px;color:var(--sub);font-size:11px}
#mikke-demo .story-empty{height:104px;background:var(--soft);display:grid;place-items:center;color:var(--sub);font-size:12px}
#mikke-demo .detail-cover-empty{height:145px;border-radius:16px;background:var(--soft);display:grid;place-items:center;color:var(--sub)}
#mikke-demo .story-edit-stop{padding:13px;border-radius:13px;background:var(--paper);margin-top:13px}
#mikke-demo .story-edit-stop h2{font-size:14px;margin:0 0 8px}
#mikke-demo .story-edit-stop .form-group{margin:10px 0}
#mikke-demo .story-edit-stop input[type="file"]{font-size:12px;min-height:0}
#mikke-demo .empty-cover{height:100%;background:var(--soft);color:var(--sub);display:grid;place-items:center;font-size:11px}
#mikke-demo .home-empty{height:100px;border-radius:12px;background:var(--soft);color:var(--sub);display:grid;place-items:center;font-size:11px}
#mikke-demo .saved-item{padding:15px 0}
#mikke-demo .profile-hero{padding:14px;border:0;border-radius:16px;background:var(--soft);margin:13px 0 0}
#mikke-demo .profile-hero .avatar{background:var(--white)}
#mikke-demo .filter-grid{padding:10px;border-radius:12px;background:var(--paper)}
#mikke-demo .filter-grid[hidden]{display:none}
#mikke-demo .toast{background:var(--ink);color:#fff;border-radius:10px;text-align:center;padding:10px;font-size:12px;margin-bottom:13px}
#mikke-demo .bottom-nav{height:75px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--white);border-top:1px solid var(--line);padding:0 5px 10px;position:relative}
#mikke-demo .nav-item{border:0;background:none;color:var(--sub);height:53px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;white-space:nowrap;padding:0 2px}
#mikke-demo .nav-item.on{color:var(--deep);font-weight:750}
#mikke-demo .nav-item svg{width:19px;height:19px}
#mikke-demo .nav-item.center{height:72px;justify-content:flex-end}
#mikke-demo .nav-item.center .plus{width:51px;height:51px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--orange));display:grid;place-items:center;color:#33251f;box-shadow:0 4px 12px #F4776950;font-size:31px;font-weight:350;line-height:1;margin-bottom:1px}
#mikke-demo .nav-item.center.on .plus{box-shadow:0 0 0 3px var(--pale),0 4px 12px #F4776950}
#mikke-demo .mikke-phone{height:min(760px,90dvh);min-height:510px}
#mikke-demo .mikke-app{height:100%;min-height:0;display:flex;flex-direction:column}
#mikke-demo .mikke-app>.page{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#E0DCD4 transparent;touch-action:pan-y}
#mikke-demo .mikke-app>.page::-webkit-scrollbar{width:5px}
#mikke-demo .mikke-app>.page::-webkit-scrollbar-thumb{background:#E0DCD4;border-radius:99px}
#mikke-demo .shell-top,#mikke-demo .bottom-nav{flex:none}
#mikke-demo .settings-group{margin:21px 0 9px;color:var(--sub);font-size:11px;font-weight:750}
#mikke-demo .settings-list{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--white)}
#mikke-demo .settings-list button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:55px;background:var(--white);border:0;border-bottom:1px solid var(--line);padding:12px 15px;color:var(--ink);font-size:13px;text-align:left}
#mikke-demo .settings-list button:last-child{border-bottom:0}
#mikke-demo .settings-list button span:last-child{color:var(--sub);font-size:12px}
#mikke-demo .settings-list button:active{background:var(--paper)}
#mikke-demo .setting-toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 2px;border-bottom:1px solid var(--line)}
#mikke-demo .setting-toggle strong{font-size:13px;display:block}
#mikke-demo .setting-toggle small{font-size:11px;color:var(--sub);display:block;margin-top:3px}
#mikke-demo .setting-toggle input{appearance:none;width:44px;height:27px;flex:none;position:relative;border-radius:20px;background:#DFE0D8;cursor:pointer;transition:background .16s}
#mikke-demo .setting-toggle input:checked{background:var(--coral)}
#mikke-demo .setting-toggle input:after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .16s}
#mikke-demo .setting-toggle input:checked:after{transform:translateX(17px)}
#mikke-demo .setting-toggle input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#mikke-demo .settings-info{padding:13px 0;color:var(--sub);font-size:12px;border-bottom:1px solid var(--line)}
#mikke-demo details{border-bottom:1px solid var(--line);padding:14px 0;font-size:12px}
#mikke-demo details summary{font-weight:700;cursor:pointer}
#mikke-demo details p{margin-top:9px;color:var(--sub);line-height:1.6}
@media(max-width:420px){#mikke-demo{padding:0}#mikke-demo .mikke-phone{border-radius:0;border:0;box-shadow:none;width:100%;height:min(800px,94dvh)}}

  function compactPost(r){const cover=coverSrc(r);return `<article class="post"><button class="post-image" data-route="${r.id}" aria-label="${esc(r.title)}の詳細を見る">${cover?`<img src="${cover}" alt="ルートの写真">`:'<span class="empty-cover">写真なし</span>'}<span class="tag">${esc(r.genre||'ルート')} · ${esc(r.theme||'お出かけ')}</span></button><div class="post-body"><button class="post-title" data-route="${r.id}">${esc(r.title)}</button><div class="byline">${avatar(r.author)} ${esc(r.area)}</div><div class="meta-row">${icon('clock-3')} ${esc(r.hours)} · ${r.stops.length}か所</div><div class="card-price">${esc(r.budget)}</div><div class="post-actions"><button data-like="${r.id}" class="${state.likes.has(r.id)?'on':''}" aria-label="いいね ${(r.demoLikes||0)+(state.likes.has(r.id)?1:0)}件" aria-pressed="${state.likes.has(r.id)}">${icon('heart')} ${(r.demoLikes||0)+(state.likes.has(r.id)?1:0)}</button><button data-wish="${r.id}" class="${state.wishes.has(r.id)?'on':''}" aria-label="行きたい・保存 ${(r.demoSaves||0)+(state.wishes.has(r.id)?1:0)}件" aria-pressed="${state.wishes.has(r.id)}">${icon('bookmark')} ${(r.demoSaves||0)+(state.wishes.has(r.id)?1:0)}</button></div></div></article>`}
  function home(){return `<section class="page home-page"><div class="home-hero"><img src="${photo[1]}" alt="札幌の秋の公園"><div class="home-hero-inner"><div class="home-topline"><strong>Mikke</strong><span class="home-location">${icon('map-pin')} ${esc(state.homeArea)}</span></div><p class="home-greeting">こんにちは。次はどこへ行こう？</p><h1>行きたいを、<br>今日のお出かけに。</h1><div class="home-chips" aria-label="ルートのジャンル"><button data-home-category="カフェ">${icon('coffee')} カフェ</button><button data-home-category="自然">${icon('trees')} 自然</button><button data-home-category="すべて">${icon('map')} すべて</button></div><form class="home-search" data-form="home-plan"><p class="home-search-caption">今日のルートを探す</p><div class="home-controls"><label>出発地<select name="origin"><option ${state.origin==='大通駅'?'selected':''}>大通駅</option><option ${state.origin==='札幌駅'?'selected':''}>札幌駅</option><option ${state.origin==='円山公園'?'selected':''}>円山公園</option></select></label><label>使える時間<select name="hours">${['3時間','4時間','6時間'].map(x=>`<option ${state.hours===x?'selected':''}>${x}</option>`).join('')}</select></label><label>予算<select name="budget">${['3,000円','5,000円','8,000円'].map(x=>`<option ${state.budget===x?'selected':''}>${x}</option>`).join('')}</select></label></div><button type="submit">ルートを見つける →</button></form></div></div><div class="home-content"><div class="section-head"><h2>人気のルート</h2><button class="text-button" data-tab="feed">すべて見る →</button></div><div class="home-route-grid">${routes.slice(0,2).map(r=>`<button class="home-route" data-route="${r.id}">${coverSrc(r)?`<img src="${coverSrc(r)}" alt="">`:'<span class="home-empty">写真なし</span>'}<strong>${esc(r.title)}</strong><span>${esc(r.area)} · ${esc(r.hours)}</span></button>`).join('')}</div><div class="section-head"><h2>保存した行きたい場所</h2><button class="text-button" data-tab="saved">一覧を見る →</button></div><div class="home-save-panel"><span class="tile-ico">${icon('bookmark')}</span><div><strong>${state.places.length}か所を保存中</strong><small>プランを作るときに使えます</small></div><button data-tab="create">作る →</button></div><button class="home-add" data-action="share">＋ SNSで見つけた場所を保存</button></div></section>`}
  function pageBanner(index,title,subtitle){return `<div class="page-banner"><img src="${photo[index]}" alt=""><div class="page-banner-copy"><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div></div>`}
  function feed(){let q=state.query.trim().toLocaleLowerCase('ja');let show=routes.filter(r=>(state.showMyPosts||r.author!=='あなた')&&(!q||[r.title,r.area,r.lead,r.genre,r.theme,...r.stops.map(s=>s.name)].join(' ').toLocaleLowerCase('ja').includes(q))&&(state.region==='すべて'||r.area.includes(state.region))&&(state.maxCost==='すべて'||(r.cost||Infinity)<=Number(state.maxCost))&&(state.genre==='すべて'||r.genre===state.genre)&&(state.theme==='すべて'||r.theme===state.theme));if(state.sort==='いいねが多い順')show.sort((a,b)=>(b.demoLikes||0)+(state.likes.has(b.id)?1:0)-(a.demoLikes||0)-(state.likes.has(a.id)?1:0));if(state.sort==='保存が多い順')show.sort((a,b)=>(b.demoSaves||0)+(state.wishes.has(b.id)?1:0)-(a.demoSaves||0)-(state.wishes.has(a.id)?1:0));const select=(label,key,choices)=>`<label>${label}<select class="field" data-feed-filter="${key}" aria-label="${label}">${choices.map(([value,text])=>`<option value="${esc(value)}" ${state[key]===value?'selected':''}>${esc(text)}</option>`).join('')}</select></label>`;return `<section class="page">${pageBanner(0,'みんなのルート','気になる一日を探して、次の予定に。')}<form class="search-row" data-form="search"><input class="field" name="query" type="search" placeholder="キーワードで探す" aria-label="キーワードでルートを検索" value="${esc(state.query)}"><button type="submit">検索</button><button type="button" class="details-button" data-toggle-filters aria-expanded="${state.filtersOpen}" aria-controls="mikke-detail-filters">詳細設定</button></form><div class="filter-grid" id="mikke-detail-filters" ${state.filtersOpen?'':'hidden'}>${select('地域','region',[['すべて','地域すべて'],['円山','円山'],['大通','大通'],['札幌駅','札幌駅'],['中島公園','中島公園']])}${select('予算','maxCost',[['すべて','予算すべて'],['3000','〜3,000円'],['5000','〜5,000円']])}${select('系統','genre',[['すべて','系統すべて'],['カフェ','カフェ'],['ラーメン','ラーメン'],['自然','自然']])}${select('テーマ','theme',[['すべて','テーマすべて'],['デート','デート'],['ひとり','ひとり']])}</div><div class="sort-row"><span>${show.length}件のルート</span>${select('並び順','sort',[['おすすめ','おすすめ'],['いいねが多い順','いいねが多い順'],['保存が多い順','保存が多い順']])}</div>${show.length?`<div class="route-grid">${show.map(compactPost).join('')}</div>`:'<div class="notice">条件に合うルートがありません。地域や予算を変えてみてください。</div>'}<p class="tiny" style="margin-top:13px">写真・ルート・反応数は操作確認用のサンプルです。</p></section>`}
  function detail(){const r=getRoute(state.routeId);const comments=state.comments[r.id]||[];const cover=coverSrc(r);return `<section class="page route-story"><button class="back" data-back="1">${icon('chevron-left')} 戻る</button>${cover?`<img class="detail-photo" src="${cover}" alt="${esc(r.title)}の写真">`:'<div class="detail-cover-empty">代表写真なし</div>'}<div class="detail-author">${avatar(r.author)}<span>${esc(r.author==='あなた'?state.displayName:r.author)}<br><small>${esc(r.kind)}</small></span></div><h1 class="detail-title">${esc(r.title)}</h1><div class="meta-row">${icon('map-pin')} ${esc(r.area)}　${icon('clock-3')} ${esc(r.hours)}　${icon('wallet')} ${esc(r.budget)}</div><p class="detail-lead">${esc(r.lead)}</p><div class="story-heading"><h2>この日の記録</h2><small>${r.stops.length}か所の立ち寄り</small></div><div class="story-stream">${r.stops.map((s,i)=>{const sample=sampleMoments[r.id]?.[i]||[];const time=s.time||sample[0]||'時刻なし';const action=s.action||sample[1]||'立ち寄りました';const src=s.photo||(Number.isInteger(s.image)?photo[s.image]:null);return `<article class="story-entry"><div class="story-time">${esc(time)}</div><div class="story-card">${src?`<img src="${src}" alt="${esc(s.name)}の${r.author==='あなた'?'投稿写真':'イメージ写真'}">`:'<div class="story-empty">写真なし</div>'}<div class="story-card-body"><small>${i+1}か所目 · ${esc(s.name)}</small><h3>${esc(action)}</h3><p>${esc(s.note||'')}</p>${s.move?`<div class="transfer">${icon('footprints')} ${esc(s.move)}</div>`:''}</div></div></article>`}).join('')}</div>${r.author==='あなた'?'':'<p class="tiny">この投稿の時刻・文章・写真は操作確認用のサンプルです。</p>'}<div class="action-row"><button class="primary" data-action="same">同じ順番で行く</button><button class="secondary" data-action="adapt">今日向けに調整</button></div><p class="tiny">店舗・営業時間・移動時間は未確認です。出かける前にご確認ください。</p><div class="post-actions" style="margin-top:18px"><button data-like="${r.id}" class="${state.likes.has(r.id)?'on':''}" aria-pressed="${state.likes.has(r.id)}">${icon('heart')} いいね</button><button data-wish="${r.id}" class="${state.wishes.has(r.id)?'on':''}" aria-pressed="${state.wishes.has(r.id)}">${icon('bookmark')} ${state.wishes.has(r.id)?'行きたい済み':'行きたい'}</button></div><div class="comments"><h2>コメント ${comments.length}</h2>${comments.map(c=>`<div class="comment">${avatar('あなた')}<div><strong>あなた · 操作デモ</strong><p>${esc(c)}</p></div></div>`).join('')}<form class="comment-form" data-form="comment"><input class="field" name="comment" maxlength="100" placeholder="感想をひと言" aria-label="コメント" required><button type="submit">投稿</button></form></div></section>`}
  function create(){return `<section class="page">${pageBanner(3,'次のお出かけをつくる','行きたい場所から、今日のルートへ。')}<div class="options"><button class="option" data-source="saved">${icon('bookmark')}<span><strong>保存した場所から</strong><small>行きたい場所を組み合わせる</small></span><span class="arr">→</span></button><button class="option" data-source="community">${icon('users-round')}<span><strong>みんなのルートから</strong><small>気に入ったルートを自分向けに</small></span><span class="arr">→</span></button><button class="option" data-source="conditions">${icon('sparkles')}<span><strong>条件から探す</strong><small>時間と予算を決めて考える</small></span><span class="arr">→</span></button></div><p class="tiny">この画面ではサンプルの候補を使って操作を試せます。</p></section>`}
  function conditions(){let src=state.source;return `<section class="page"><button class="back" data-back="1">${icon('chevron-left')} 戻る</button><h1>今日の条件を教えて</h1><p class="muted">${src==='community'?`「${esc(getRoute(state.routeId).title)}」を元に調整します。`:src==='saved'?'保存した行きたい場所から組み立てます。':'今の気分に合わせて考えます。'}</p><div class="form-group"><label>使える時間</label><div class="choice-row">${['3時間','4時間','6時間'].map(x=>`<button data-hours="${x}" class="${state.hours===x?'on':''}" aria-pressed="${state.hours===x}">${x}</button>`).join('')}</div></div><div class="form-group"><label>予算の目安</label><div class="choice-row">${['3,000円','5,000円','8,000円'].map(x=>`<button data-budget="${x}" class="${state.budget===x?'on':''}" aria-pressed="${state.budget===x}">${x}</button>`).join('')}</div></div><div class="form-group"><label for="mikke-origin">出発地</label><select id="mikke-origin" class="field" data-origin><option ${state.origin==='大通駅'?'selected':''}>大通駅</option><option ${state.origin==='札幌駅'?'selected':''}>札幌駅</option><option ${state.origin==='円山公園'?'selected':''}>円山公園</option></select></div><div class="notice">出発地は操作デモ用の選択肢です。位置情報や店舗の営業状況は取得しません。</div><button class="primary full" data-action="generate">ルートを見てみる →</button></section>`}
  function planStops(index){const source=state.source==='community'?getRoute(state.routeId):routes[0];let stops=source.stops.map(s=>s.name);if(index===1)stops=[stops[0],stops[2]];if(index===2)stops=[stops[0],stops[1]];return stops}
  function results(){const names=['今日のおすすめ','少し短めのルート','寄り道を減らすルート'];const base=state.source==='community'?getRoute(state.routeId):routes[0];const stops=planStops(0);const stopImage=(name,i)=>base.stops.find(x=>x.name===name)?.image??[1,2,3][i%3];return `<section class="page results-page"><button class="back" data-back="1">${icon('chevron-left')} 条件を変える</button><h1>今日のルート提案</h1><div class="result-summary"><span>${icon('map-pin')} ${esc(state.origin)}から</span><span>${icon('clock-3')} 希望 ${esc(state.hours)}</span><span>${icon('wallet')} 希望 ${esc(state.budget)}</span></div><div class="result-main"><span class="label">主提案</span><h2>${names[0]}</h2><p class="description">${stops.length}か所を順番にめぐるプラン</p><div class="result-timeline" aria-label="主提案の立ち寄り順">${stops.map((name,i)=>`<div class="result-stop"><span class="result-marker">${i+1}</span><div class="result-stop-card"><div class="result-stop-text"><small>${i+1}か所目</small><strong>${esc(name)}</strong></div><img src="${photo[stopImage(name,i)]}" alt="立ち寄り先のイメージ"></div></div>`).join('')}</div><button class="primary" data-plan="0">このルートを選ぶ →</button></div><div class="section-head"><h2>ほかの提案</h2></div>${[1,2].map(i=>`<article class="result-alt"><span class="label">代案 ${i}</span><strong>${names[i]}</strong><p>${planStops(i).map(esc).join(' → ')}</p><button data-plan="${i}">このルートを選ぶ →</button></article>`).join('')}<div class="notice">立ち寄り順は画面確認用の提案です。経路・時刻・料金・営業時間は計算や確認を行っていません。</div></section>`}
  function active(){let a=state.active||{stops:planStops(state.selectedPlan),index:0};return `<section class="page"><button class="back" data-back="1">${icon('chevron-left')} 戻る</button><div class="eyebrow">LET'S GO</div><h1>今日のルート</h1><p class="muted">立ち寄った場所を確認して、思い出を残そう。</p><div class="notice">このデモはナビゲーションや到着の自動判定を行いません。</div>${a.stops.map((s,i)=>`<div class="journey-step"><span class="number">${i+1}</span><div><strong>${esc(s)}</strong><small>${i<a.index?'チェック済み':i===a.index?'次の立ち寄り先':'このあと'}</small></div></div>`).join('')}<div class="action-row">${a.index<a.stops.length?`<button class="secondary" data-action="next-stop">この場所に行った</button>`:''}<button class="primary" data-action="finish">お出かけを記録</button></div></section>`}
  function record(){let stops=state.active?.stops||planStops(state.selectedPlan);return `<section class="page"><button class="back" data-back="1">${icon('chevron-left')} 戻る</button><h1>今日の記録を残そう</h1><p class="muted">実際に行った場所だけを選んでください。</p><form data-form="record"><div class="options">${stops.map((s,i)=>`<label class="option"><input type="checkbox" name="visited" value="${i}" ${i<(state.active?.index||0)?'checked':''}><span><strong>${esc(s)}</strong><small>行った場合にチェック</small></span></label>`).join('')}</div><div class="form-group"><label for="mikke-memory">ひと言（任意）</label><textarea class="field" id="mikke-memory" name="memory" placeholder="今日の思い出をひと言"></textarea></div><div class="notice">保存した記録は最初は非公開です。公開には別の操作が必要です。</div><button type="submit" class="primary full">非公開で記録を保存</button></form></section>`}
  function compose(){const stops=state.visitDraft?.stops||[];return `<section class="page"><button class="back" data-back="1">${icon('chevron-left')} 戻る</button><h1>ルートを投稿する</h1><p class="muted">行った場所ごとに、時刻・写真・ひと言を残せます。</p><form data-form="publish"><div class="form-group"><label for="mikke-title">ルートの名前</label><input id="mikke-title" class="field" name="title" maxlength="40" placeholder="例：秋のカフェ散歩" required value="${esc(state.postTitle)}"></div><div class="form-group"><label for="mikke-note">一日の紹介（任意）</label><textarea id="mikke-note" class="field" name="note" maxlength="160" placeholder="どんな一日だった？">${esc(state.postNote)}</textarea></div>${stops.map((name,i)=>`<div class="story-edit-stop"><h2>${i+1}. ${esc(name)}</h2><div class="form-group"><label for="mikke-time-${i}">行った時刻（任意）</label><input id="mikke-time-${i}" class="field" name="time-${i}" type="time"></div><div class="form-group"><label for="mikke-photo-${i}">その場所で撮った写真（任意）</label><input id="mikke-photo-${i}" class="field" name="photo-${i}" type="file" accept="image/*"></div><div class="form-group"><label for="mikke-stop-note-${i}">何をした？ひと言（任意）</label><textarea id="mikke-stop-note-${i}" class="field" name="stop-note-${i}" maxlength="140" placeholder="例：ケーキを食べた。おいしかった！"></textarea></div></div>`).join('')}<div class="notice">公開操作はこのデモ内だけです。写真は端末内で読み込み、外部には送信しません。</div><button class="primary full" type="submit">このデモ内で投稿する</button></form></section>`}
  function share(){return `<section class="page"><button class="back" data-back="1">${icon('chevron-left')} 戻る</button><h1>行きたい場所を保存</h1><p class="muted">SNSで見つけた投稿のリンクをメモしよう。</p><form data-form="place"><div class="form-group"><label for="mikke-url">投稿のURL</label><input class="field" id="mikke-url" name="url" type="url" placeholder="https://..." required></div><div class="form-group"><label for="mikke-name">場所の名前</label><input class="field" id="mikke-name" name="name" maxlength="40" placeholder="例：気になるカフェ" required></div><div class="notice">URLからの店舗情報抽出はこのデモでは行いません。入力した名前で保存一覧に追加します。</div><button class="primary full" type="submit">行きたい場所に追加</button></form></section>`}
  function saved(){let t=state.savedTab;let items=t==='場所'?state.places.map((x,i)=>({title:x,sub:'行きたい場所 · 保存済み',action:'使う',attr:`data-action="use-place" data-index="${i}"`})):t==='ルート'?state.created.map((x,i)=>({title:x.title,sub:'作ったルート · 非公開',action:'見る',attr:`data-action="view-created" data-index="${i}"`})):t==='行った記録'?state.visited.map((x,i)=>({title:x.title,sub:`${x.stops.length}か所 · ${x.published?'このデモ内で公開':'非公開'}`,action:x.published?'見る':'投稿',attr:`data-action="${x.published?'view-visit':'publish-visit'}" data-index="${i}"`})):[...state.wishes].map(id=>({title:getRoute(id).title,sub:`${getRoute(id).area} · 行きたい`,action:'見る',attr:`data-route="${id}"`}));return `<section class="page">${pageBanner(2,'保存一覧','行きたい場所も、思い出も。')}<div class="segmented" role="group" aria-label="保存の分類">${['場所','ルート','行った記録','行きたい'].map(x=>`<button data-saved="${x}" class="${t===x?'on':''}" aria-pressed="${t===x}">${x}</button>`).join('')}</div>${items.length?items.map(x=>`<div class="saved-item"><div><strong>${esc(x.title)}</strong><small>${esc(x.sub)}</small></div><button ${x.attr}>${x.action} →</button></div>`).join(''):`<div class="notice">${t==='行きたい'?'みんなのルートで「行きたい」を押すと、ここで見られます。':t==='行った記録'?'お出かけを記録すると、ここに残ります。':'まだ保存したルートがありません。'}</div>`}${t==='場所'?`<button class="secondary full" style="margin-top:20px" data-action="share">＋ 場所を追加</button>`:''}</section>`}
  function profile(){return `<section class="page"><h1>マイページ</h1><div class="profile-hero">${avatar('あなた')}<div><h2>${esc(state.displayName)}</h2><p class="muted">${esc(state.homeArea)} · Mikke 操作デモ</p></div></div><div class="free-quota"><div class="quota-label">今月の無料ルート生成</div><div class="quota-main">残り <strong>${state.freeRemaining}</strong> 回</div><p class="tiny">残り回数は画面確認用の仮表示です</p><button data-tab="create">ルートを作る →</button></div><div class="settings-group">あなたの記録</div><div class="settings-list"><button data-tab="saved"><span>保存した場所</span><span>${state.places.length}件 →</span></button><button data-profile="visits"><span>行った記録</span><span>${state.visited.length}件 →</span></button><button data-profile="posts"><span>自分の投稿</span><span>${routes.filter(r=>r.author==='あなた').length}件 →</span></button></div><div class="settings-group">アカウントとアプリ</div><div class="settings-list"><button data-settings="settings"><span>設定</span><span>→</span></button><button data-settings="help"><span>ヘルプ・使い方</span><span>→</span></button></div><p class="tiny" style="margin-top:18px">設定と残り回数は、この画面内で試せる仮の内容です。</p></section>`}
  function settings(){return `<section class="page"><button class="back" data-back="1">${icon('chevron-left')} マイページ</button><h1>設定</h1><p class="muted">Mikkeを使いやすくカスタマイズ</p><div class="settings-group">アカウント</div><div class="settings-list"><button data-settings="account"><span>プロフィール</span><span>${esc(state.displayName)} →</span></button><button data-settings="area"><span>よく行く地域</span><span>${esc(state.homeArea)} →</span></button></div><div class="settings-group">アプリ</div><div class="settings-list"><button data-settings="notifications"><span>通知</span><span>→</span></button><button data-settings="privacy"><span>投稿の表示</span><span>→</span></button><button data-settings="help"><span>ヘルプ・使い方</span><span>→</span></button></div><div class="settings-info">Mikke · 画面操作デモ</div><p class="tiny" style="margin-top:15px">変更はこの画面を開いている間だけ反映されます。</p></section>`}
  function settingDetail(){const s=state.screen;const title={account:'プロフィール',area:'よく行く地域',notifications:'通知',privacy:'投稿の表示',help:'ヘルプ・使い方'}[s];let body='';if(s==='account')body=`<form data-form="account"><div class="form-group"><label for="mikke-display-name">表示名</label><input class="field" id="mikke-display-name" name="name" maxlength="20" required value="${esc(state.displayName)}"></div><button class="primary full" type="submit" style="margin-top:21px">保存する</button></form>`;if(s==='area')body=`<p class="muted" style="margin:12px 0">ホームと画面右上に表示する地域です。</p><div class="settings-list">${['札幌','円山','大通'].map(x=>`<button data-area="${x}" aria-pressed="${state.homeArea===x}"><span>${x}</span><span>${state.homeArea===x?'✓':'　'}</span></button>`).join('')}</div>`;if(s==='notifications')body=`<label class="setting-toggle"><span><strong>週末のお出かけ提案</strong><small>新しいルートのおすすめ</small></span><input type="checkbox" data-preference="weekendHints" ${state.weekendHints?'checked':''} aria-label="週末のお出かけ提案"></label><label class="setting-toggle"><span><strong>保存したルートの更新</strong><small>気になるルートのお知らせ</small></span><input type="checkbox" data-preference="savedUpdates" ${state.savedUpdates?'checked':''} aria-label="保存したルートの更新"></label><div class="notice">このデモから実際の通知は届きません。</div>`;if(s==='privacy')body=`<label class="setting-toggle"><span><strong>自分の投稿を「みんな」に表示</strong><small>オフにすると一覧から非表示</small></span><input type="checkbox" data-preference="showMyPosts" ${state.showMyPosts?'checked':''} aria-label="自分の投稿をみんなの一覧に表示"></label><div class="notice">この切り替えは操作デモ内の一覧表示だけに反映されます。</div><button class="secondary full" data-settings="my-posts">自分の投稿を見る →</button>`;if(s==='help')body=`<div class="settings-group">よくある質問</div><details><summary>ルートを作るには？</summary><p>ホームで出発地・時間・予算を選んで「ルートを見つける」を押してください。画面下の＋からも始められます。</p></details><details><summary>行った記録を投稿するには？</summary><p>ルートを選び「お出かけを記録」から、行った場所を選択します。保存一覧の「行った記録」から時刻・写真・ひと言を付けて投稿できます。</p></details><details><summary>保存したルートはどこで見られる？</summary><p>画面下の「保存」から「行きたい」を開くと見られます。</p></details><div class="notice">Mikkeの操作を試すためのデモです。入力や投稿は外部に送信されません。</div>`;return `<section class="page"><button class="back" data-back="1">${icon('chevron-left')} ${s==='help'&&state.helpFromProfile?'マイページ':'設定'}へ</button><h1>${title}</h1>${body}</section>`}
  function myPosts(){const mine=routes.filter(r=>r.author==='あなた');return `<section class="page"><button class="back" data-back="1">${icon('chevron-left')} マイページ</button><h1>自分の投稿</h1><p class="muted">投稿した一日の記録を確認できます。</p>${mine.length?`<div class="route-grid" style="margin-top:17px">${mine.map(compactPost).join('')}</div>`:'<div class="notice">まだ投稿がありません。お出かけを記録すると、ここに表示されます。</div>'}<button class="secondary full" style="margin-top:18px" data-tab="create">ルートを作る →</button></section>`}
  function viewKey(){return state.screen?`${state.screen}:${state.screen==='detail'?state.routeId:''}`:state.tab==='saved'?`saved:${state.savedTab}`:state.tab}
  function render(){const previous=app.querySelector('.page[data-view]');if(previous)state.scrollPositions[previous.dataset.view]=previous.scrollTop;let content=state.screen==='detail'?detail():state.screen==='conditions'?conditions():state.screen==='results'?results():state.screen==='active'?active():state.screen==='record'?record():state.screen==='compose'?compose():state.screen==='share'?share():state.screen==='settings'?settings():['account','area','notifications','privacy','help'].includes(state.screen)?settingDetail():state.screen==='my-posts'?myPosts():state.tab==='home'?home():state.tab==='feed'?feed():state.tab==='create'?create():state.tab==='saved'?saved():profile();app.innerHTML=(state.tab==='home'&&!state.screen?'':header())+(state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:'')+content+nav();const current=app.querySelector('.page');current.dataset.view=viewKey();current.tabIndex=0;current.scrollTop=state.scrollPositions[viewKey()]||0;if(window.lucide&&typeof window.lucide.createIcons==='function')window.lucide.createIcons({attrs:{width:18,height:18}})}
  function notify(msg){state.toast=msg;render();setTimeout(()=>{if(state.toast===msg){state.toast='';render()}},2700)}
  function tab(name){state.tab=name;state.screen=null;state.toast='';state.scrollPositions[name]=0;render()}
  function back(){let s=state.screen;if(s==='detail'){state.tab=state.routeReturn?.tab||'feed';state.screen=state.routeReturn?.screen||null;state.savedTab=state.routeReturn?.savedTab||state.savedTab}else if(s==='conditions'){state.screen=state.source==='community'?'detail':null;state.tab=state.source==='community'?'feed':state.conditionsReturn||'create'}else if(s==='results')state.screen='conditions';else if(s==='active')state.screen='results';else if(s==='record')state.screen='active';else if(s==='compose'){state.screen=null;state.tab='saved';state.savedTab='行った記録'}else if(['account','area','notifications','privacy'].includes(s)){state.screen='settings'}else if(s==='help'){state.screen=state.helpFromProfile?null:'settings';state.tab='profile'}else if(['settings','my-posts'].includes(s)){state.screen=null;state.tab='profile'}else if(s==='share'){state.tab=state.shareReturn?.tab||'home';state.screen=state.shareReturn?.screen||null}else{state.screen=null;state.tab='home'}render()}
  root.addEventListener('click',e=>{const b=e.target.closest('[data-toggle-filters]');if(b&&root.contains(b)){state.filtersOpen=!state.filtersOpen;render()}});
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;let d=b.dataset;if(d.homeCategory){state.genre=d.homeCategory;tab('feed');return}if(d.tab){tab(d.tab);return}if(d.back){back();return}if(d.settings){if(d.settings==='help')state.helpFromProfile=state.screen!=='settings';state.screen=d.settings;render();return}if(d.area){state.homeArea=d.area;render();return}if(d.route){state.routeReturn={tab:state.tab,screen:state.screen,savedTab:state.savedTab};state.routeId=Number(d.route);state.screen='detail';render();return}if(d.like){let id=Number(d.like);state.likes.has(id)?state.likes.delete(id):state.likes.add(id);render();return}if(d.wish){let id=Number(d.wish);state.wishes.has(id)?state.wishes.delete(id):state.wishes.add(id);render();return}if(d.filter){state.filter=d.filter;render();return}if(d.saved){state.savedTab=d.saved;render();return}if(d.hours){state.hours=d.hours;render();return}if(d.budget){state.budget=d.budget;render();return}if(d.source){state.source=d.source;state.conditionsReturn=state.tab;if(d.source==='community'){tab('feed');return}state.screen='conditions';render();return}if(d.profile){if(d.profile==='posts'){state.screen='my-posts'}else{state.tab='saved';state.screen=null;state.savedTab='行った記録'}render();return}if(d.plan!==undefined){state.selectedPlan=Number(d.plan);const stops=planStops(state.selectedPlan);state.active={stops,index:0};state.created.unshift({title:'今日のルート',stops});state.screen='active';render();return}if(d.action){switch(d.action){case'share':state.shareReturn={tab:state.tab,screen:state.screen};state.screen='share';break;case'generate':state.screen='results';break;case'same':state.source='community';state.selectedPlan=0;state.active={stops:getRoute(state.routeId).stops.map(s=>s.name),index:0};state.created.unshift({title:getRoute(state.routeId).title,stops:state.active.stops});state.screen='active';break;case'adapt':state.source='community';state.screen='conditions';break;case'next-stop':state.active.index=Math.min(state.active.index+1,state.active.stops.length);break;case'finish':state.screen='record';break;case'use-place':state.source='saved';state.conditionsReturn=state.tab;state.screen='conditions';break;case'view-created':state.active={stops:state.created[Number(d.index)].stops,index:0};state.screen='active';break;case'publish-visit':state.visitDraft=state.visited[Number(d.index)];state.screen='compose';break;case'view-visit':{const visit=state.visited[Number(d.index)];const r=routes.find(x=>x.visitId===visit.id);if(r){state.routeReturn={tab:state.tab,screen:state.screen,savedTab:state.savedTab};state.routeId=r.id;state.screen='detail'}break}}render();return}});
  root.addEventListener('change',e=>{if(e.target.matches('[data-origin]'))state.origin=e.target.value;if(e.target.matches('[data-preference]')){state[e.target.dataset.preference]=e.target.checked;render()}if(e.target.matches('[data-feed-filter]')){state[e.target.dataset.feedFilter]=e.target.value;render()}});
  root.addEventListener('submit',async e=>{let f=e.target;if(!f.matches('[data-form]'))return;e.preventDefault();let v=new FormData(f);if(f.dataset.form==='account'){state.displayName=String(v.get('name')||'あなた').trim().slice(0,20)||'あなた';notify('表示名を保存しました');return}if(f.dataset.form==='home-plan'){state.origin=String(v.get('origin')||'大通駅');state.hours=String(v.get('hours')||'4時間');state.budget=String(v.get('budget')||'5,000円');state.source='conditions';state.screen='results';render();return}if(f.dataset.form==='search'){state.query=String(v.get('query')||'').trim();render();return}if(f.dataset.form==='comment'){let c=String(v.get('comment')||'').trim();if(c){(state.comments[state.routeId]??=[]).push(c);render()}}else if(f.dataset.form==='place'){let name=String(v.get('name')||'').trim();if(!name)return;state.places.push(name);state.tab='saved';state.savedTab='場所';state.screen=null;notify('行きたい場所に追加しました')}else if(f.dataset.form==='record'){let selected=v.getAll('visited').map(Number);if(!selected.length){notify('行った場所を一つ以上選んでください');return}let entry={id:Date.now(),title:'今日のお出かけ',stops:state.active.stops.filter((_,i)=>selected.includes(i)),memory:String(v.get('memory')||''),published:false};state.visited.unshift(entry);state.visitDraft=entry;state.tab='saved';state.savedTab='行った記録';state.screen=null;notify('非公開の記録として保存しました')}else if(f.dataset.form==='publish'){let title=String(v.get('title')||'').trim();if(!title)return;let note=String(v.get('note')||'').trim();let visit=state.visitDraft;let files=visit.stops.map((_,i)=>v.get('photo-'+i));if(files.some(file=>file?.size>5_000_000)){notify('写真は1枚5MB以内にしてください');return}let images;try{images=await Promise.all(files.map(fileData))}catch{notify('写真を読み込めませんでした');return}visit.title=title;visit.published=true;let id=Math.max(...routes.map(r=>r.id))+1;routes.unshift({id,visitId:visit.id,title,area:'札幌',hours:'時間未設定',budget:'費用未設定',cost:0,genre:'お出かけ',theme:'ひとり',demoLikes:0,demoSaves:0,author:'あなた',kind:'行ったルート・操作デモ',lead:note||'今日のお出かけの記録。',cover:images.find(Boolean)||null,image:null,tags:[],stops:visit.stops.map((name,i)=>({name,time:String(v.get('time-'+i)||''),action:'立ち寄りました',note:String(v.get('stop-note-'+i)||'').trim()||'行った場所の記録です。',photo:images[i]||null}))});state.routeReturn={tab:'feed',screen:null,savedTab:state.savedTab};state.routeId=id;state.tab='feed';state.screen='detail';notify('このデモ内の「みんなのルート」に投稿しました')}});
  render();
})();
</script>

</body></html>
